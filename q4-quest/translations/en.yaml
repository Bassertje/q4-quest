configuration:
  odometer_entity:
    name: Odometer sensor
    description: Entity with the total mileage of the car (in km). Required.
  soc_entity:
    name: Battery level sensor
    description: Entity with the state of charge in %. Optional.
  charging_power_entity:
    name: Charging power sensor
    description: Entity with the charging power (W or kW). Optional.
  charging_state_entity:
    name: Charging state sensor
    description: Entity that tells whether the car is charging. Optional.
  charging_type_entity:
    name: Charging type sensor
    description: Entity that tells whether the car charges AC or DC. Optional.
  range_entity:
    name: Range sensor
    description: Entity with the remaining range in km. Optional.
  parking_brake_entity:
    name: Parking brake sensor
    description: Helps to split trips. Optional.
  temperature_entity:
    name: Outdoor temperature sensor
    description: Entity with the outdoor temperature (°C or °F). Optional; enables temperature features.
  battery_kwh:
    name: Usable battery capacity (kWh)
    description: Used for kWh estimates. Default 77.
  co2_petrol_kg_per_km:
    name: CO₂ of a petrol car (kg/km)
    description: For the CO₂ saving estimate. Default 0.18.
  co2_grid_kg_per_kwh:
    name: CO₂ of grid electricity (kg/kWh)
    description: For the CO₂ saving estimate. Default 0.33.
  petrol_l_per_100km:
    name: Fuel use of a comparable petrol car (l/100 km)
    description: For the "litres not burned" estimate. Default 6.5.
